<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Resume Tailor</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body {
				height: 100%;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0f172a;
				color: #e2e8f0;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				-webkit-app-region: drag;
				user-select: none;
			}
			.card {
				text-align: center;
				padding: 32px 40px;
			}
			.mark {
				width: 56px;
				height: 56px;
				margin: 0 auto 16px;
				border-radius: 16px;
				background: linear-gradient(135deg, #38bdf8, #818cf8 60%, #c084fc);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 28px;
				font-weight: 800;
				color: #0f172a;
			}
			h1 {
				font-size: 20px;
				font-weight: 800;
				letter-spacing: -0.02em;
			}
			p {
				margin-top: 6px;
				font-size: 12px;
				color: #94a3b8;
			}
			.spinner {
				width: 28px;
				height: 28px;
				margin: 20px auto 0;
				border-radius: 50%;
				border: 3px solid #334155;
				border-top-color: #38bdf8;
				animation: spin 0.9s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="mark">R</div>
			<h1>Resume Tailor</h1>
			<p>Loading your workspace&hellip;</p>
			<div class="spinner" aria-hidden="true"></div>
		</div>
	</body>
</html>
