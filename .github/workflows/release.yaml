name: Attach desktop artifacts to release

# Draft a release in the GitHub UI and press Publish -> each OS builds its
# installer (dmg / nsis / AppImage) and attaches it to that release.
# Artifact version numbers come from package.json `version`.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder-args: --mac
          - os: windows-latest
            builder-args: --win
          - os: ubuntu-latest
            builder-args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + Electron
        run: pnpm build:electron && pnpm build

      # --publish never: uploading is handled explicitly below so a build
      # can never attach to the wrong release.
      - name: Package installer
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      # builder-debug.yml is local diagnostics, not a release asset.
      - name: Drop build diagnostics
        run: rm -f release/builder-debug.yml

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
