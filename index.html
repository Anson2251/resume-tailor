<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
		<link rel="manifest" href="./site.webmanifest" />
		<meta name="theme-color" content="#0f172a" />
		<title>Resume Tailor</title>
		<script>
			// Set the initial theme before first paint to avoid a light/dark flash.
			try {
				var t = localStorage.getItem('resume-tailor-theme')
				if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
				if (t === 'dark') document.documentElement.classList.add('dark')
			} catch (e) {}
		</script>
		<style>
			/* Boot splash: static pre-Vue placeholder so the window is never blank
			   while the bundle loads and the workspace file is read. Vue removes
			   it on mount; colors mirror the AppSplash component. */
			#boot-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #f1f5f9;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			.dark #boot-splash,
			html.dark #boot-splash {
				background: #020617;
			}
			#boot-splash .mark {
				width: 56px;
				height: 56px;
				border-radius: 16px;
				background: linear-gradient(135deg, #38bdf8, #818cf8 60%, #c084fc);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 28px;
				font-weight: 800;
				color: #0f172a;
			}
			#boot-splash h1 {
				margin-top: 16px;
				font-size: 18px;
				font-weight: 800;
				letter-spacing: -0.02em;
				color: #0f172a;
			}
			html.dark #boot-splash h1 {
				color: #f1f5f9;
			}
			#boot-splash p {
				margin-top: 4px;
				font-size: 12px;
				color: #64748b;
			}
			#boot-splash .spinner {
				width: 28px;
				height: 28px;
				margin-top: 20px;
				border-radius: 50%;
				border: 3px solid #cbd5e1;
				border-top-color: #0ea5e9;
				animation: boot-spin 0.9s linear infinite;
			}
			html.dark #boot-splash .spinner {
				border-color: #334155;
				border-top-color: #38bdf8;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		<script type="module" crossorigin src="./assets/index-BhK4k7uO.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/event-stream-DUYe9uYC.js">
		<link rel="stylesheet" crossorigin href="./assets/index-DRPAOUUM.css">
	</head>
	<body>
		<div id="app"></div>
		<div id="boot-splash" aria-hidden="true">
			<div class="mark">R</div>
			<h1>Resume Tailor</h1>
			<p>Loading your workspace&hellip;</p>
			<div class="spinner"></div>
		</div>
	</body>
</html>
