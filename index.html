		<title>Resume Tailor</title>
		<script>
			// Set the initial theme before first paint to avoid a light/dark flash.
			try {
				var t = localStorage.getItem('resume-tailor-theme')
				if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
				if (t === 'dark') document.documentElement.classList.add('dark')
			} catch (e) {}
		</script>
		<style>#boot-splash{background:#f1f5f9;flex-direction:column;justify-content:center;align-items:center;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;position:fixed;inset:0}.dark #boot-splash,html.dark #boot-splash{background:#020617}#boot-splash .mark{color:#0f172a;background:linear-gradient(135deg,#38bdf8,#818cf8 60%,#c084fc);border-radius:16px;justify-content:center;align-items:center;width:56px;height:56px;font-size:28px;font-weight:800;display:flex}#boot-splash h1{letter-spacing:-.02em;color:#0f172a;margin-top:16px;font-size:18px;font-weight:800}html.dark #boot-splash h1{color:#f1f5f9}#boot-splash p{color:#64748b;margin-top:4px;font-size:12px}#boot-splash .spinner{border:3px solid #cbd5e1;border-top-color:#0ea5e9;border-radius:50%;width:28px;height:28px;margin-top:20px;animation:.9s linear infinite boot-spin}html.dark #boot-splash .spinner{border-color:#38bdf8 #334155 #334155}@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
